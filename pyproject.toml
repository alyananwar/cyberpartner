[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpartner"
version = "1.0.0"
description = "AI-Powered Cybersecurity Partner - Local TUI"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.47.0",
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]

[project.scripts]
cyberpartner = "cyberpartner.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cyberpartner*"]

[tool.setuptools.package-data]
cyberpartner = ["*.tcss"]
